<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e469f" />
    <title>SEPTA Bus Stop</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="gesture-controls.css" />
  </head>
  <body>
    <main class="kiosk-shell" aria-label="SEPTA bus stop arrival screen">
      <header class="topbar" aria-label="SEPTA contact information">
        <img src="assets/header-strip-cropped.png" alt="SEPTA · www.septa.org · 215-580-7800 · TDD/TTY: 215-580-7853" />
      </header>

      <div class="screen-body">
      <div class="route-carousel">
      <aside class="route-peek route-peek--previous" aria-hidden="true"><span></span></aside>
      <section class="route-panel" aria-label="Route 124 information">
      <section class="content">
        <div class="route-row">
          <div><div class="route-number" id="route-number">124</div><p class="eyebrow">Previous stop</p><h1 id="previous-stop">Girard Ave &amp; 33rd St</h1></div>
        </div>

        <section class="arrival-card" aria-label="Real-time arrival predictions">
          <div class="journey" aria-label="First bus is approaching this stop">
            <span class="journey-label">Approaching this stop</span>
            <div class="track"><i class="track-progress"></i><i class="stop-marker"></i><i class="track-end"></i></div>
            <img class="vehicle" src="assets/bus-front.png" alt="Bus en route" />
            <span class="stop-label">Your stop</span>
          </div>
          <div class="arrival-times">
            <div class="arrival first"><span>1st Bus</span><strong id="first-time">2<small> min</small></strong></div>
            <div class="arrival second"><span>2nd Bus</span><strong id="second-time">12<small> min</small></strong></div>
          </div>
          <p><i></i> Real-time arrival predictions</p>
        </section>

        <section class="stops" id="stops" aria-label="Stops on this route"></section>
      </section>
      </section>
      <aside class="route-peek route-peek--next" aria-hidden="true"><span></span></aside>
      </div>
      <nav class="route-navigation" aria-label="Route controls">
        <button class="route-switch previous" aria-label="Previous route">‹</button>
        <span>Click to view other routes</span>
        <button class="route-switch next" aria-label="Next route">›</button>
      </nav>
      <aside class="arrival-alert" id="arrival-alert" aria-live="assertive" aria-atomic="true" hidden>
        <span class="alert-kicker" id="alert-kicker"></span>
        <strong id="alert-route"></strong>
        <span id="alert-direction"></span>
        <b id="alert-message"></b>
      </aside>
      </div>
      <footer><img src="assets/footer-strip-cropped.png" alt="STOP I.D. 010101" /></footer>
    </main>
    <script src="script.js"></script>
    <script type="module" src="gesture-controls.js"></script>
  </body>
</html>
